<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" />

    <script
      src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha256-3edrmyuQ0w65f8gfBsqowzjJe2iM6n0nKciPUp8y+7E="
      crossorigin="anonymous"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r100/three.min.js"></script>
    <script src="./lib/OrbitControls.js"></script>
    <script src="./lib/js-colormaps.js"></script>
    <script
      src="https://unpkg.com/svd-js"
      type="application/javascript"
    ></script>
    <script src="survive_viewer.js"></script>
  </head>
  <body>
    <div id="ThreeJS"></div>
    <div id="cam-control">
      <label>
        <input type="checkbox" id="trails" checked />
        Trails<br />
      </label>
      <label>
        <input type="checkbox" id="fpv" />
        FPV<br />
      </label>
      <label>
        <input type="checkbox" id="model" checked />
        Model<br />
      </label>
      <label>
        <input type="checkbox" id="imu" checked />
        IMU<br />
      </label>
      <label>
        <input type="checkbox" id="external_displace" checked />Shift/
        External<br />
      </label>
      <button id="copy-camera">&#128203;</button>
      <button id="toggleBtn">Toggle 2D View</button>
    </div>
    <div id="fps">30fps</div>
    <div id="cam">
      <canvas width="800" height="800" id="camcanvas"></canvas>
    </div>

    <div id="console"></div>
    <div id="tooltip"></div>
    <input type="range" id="time" min="0" max="100" value="100" step=".01" />
  </body>
</html>
